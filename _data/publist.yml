- title: "Electron-induced single-pion production to constrain the neutron structure in 40Ar. A proof of concept."
  image: Ar40concept.png
  description: In this work, we studied electron-induced single-pion production to gain information on the neutron structure of ⁴⁰Ar, which is important for neutrino experiments using argon detectors. We simulated realistic experimental conditions for MAMI and CLAS facilities and calculated cross sections and background contributions. We found that MAMI can resolve the nuclear shell structure with low background, while CLAS has higher background and limited resolution for this purpose
