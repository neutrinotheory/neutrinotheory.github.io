- title: "Reaction Mechanisms"
  type: "centered"
  image: "/images/research_page/mechs.png"
  caption: "Reaction mechanisms overview."
  content: |
    Neutrinos interact with matter only through the weak interaction. Consequently, they are incredibly difficult to detect. Currently, there are only a few ways to observe them, and our group focuses on building models for accelerator-based neutrino oscillation experiments. These experiments require two conditions: a high-intensity neutrino beam and massive targets for the neutrinos to interact with. Both requirements present unique challenges.
    
    * **High-intensity beam:** To create a high-intensity neutrino beam, protons are accelerated to very high kinetic energies and directed toward a target block. The resulting collisions produce a variety of particles, including a large number of pions. These pions are redirected using magnetic fields and subsequently decay into muons and muon-neutrinos. A downside of this method is that the resulting beam is not mono-energetic. Instead, a wide spectrum of energies is directed toward the detector.
    * **Heavy targets:** Because neutrinos interact so rarely, we use heavy atomic nuclei such as <sup>12</sup>C, <sup>16</sup>O, and <sup>40</sup>Ar as targets to increase the probability of an interaction. However, using nuclei introduces significant theoretical challenges. Nuclei cannot be described purely by fundamental Quantum Field Theory (QFT). Because the energies of nucleons are relatively small, standard perturbation theory fails. This necessitates phenomenological models that rely on effective parameters fitted to experimental data. Because the neutrino beam is not mono-energetic, the neutrinos trigger many different types of interactions, producing a wide variety of outgoing particles. This makes it incredibly hard to reconstruct the neutrino energy from the detected final particles.
    
    To guide these analyses, we need robust theoretical models for every possible interaction. This is where the Ghent group contributes. We develop models for the cross sections of all possible neutrino-nucleus interactions. These models are integrated into "event generators" which are simulations that determine the probability of specific interactions based on the observed final-state particles. By using these simulations, researchers can reconstruct the energy of the initial neutrino. By comparing the interaction rates at two different locations (a near detector close to the beam source and a far detector hundreds of kilometers away) the neutrino oscillation parameters can be extracted and unlock the secrets of these elusive particles.
    
- title: "Quasi-elastic scattering"
  type: "side"
  image: "/images/research_page/diagram_QE.png"
  caption: 'Quasi-elastic scattering: a $\nu_\mu$ strikes an <strong>individual nucleon</strong> within a nucleus, providing enough energy to knock it out.'
  content: |
    Quasi-elastic scattering occurs when a $\nu_\mu$ interacts with a single nucleon bound inside the nucleus and transfers enough momentum to eject it. It is one of the dominant interaction channels at intermediate neutrino energies and serves as a key signal process in oscillation experiments. Accurate modelling of this process, including nuclear structure effects such as Pauli blocking, short-range correlations, and collective excitations through the Random Phase Approximation (RPA), is essential for reliable neutrino energy reconstruction.

- title: "Pion production"
  type: "side"
  image: "/images/research_page/diagram_SPP.png"
  caption: 'A $\nu_\mu$ excites a <strong>nucleon</strong> into a <strong>$\Delta$-resonance</strong> that decays into a <strong>nucleon</strong> and a <strong>pion</strong>.'
  content: |
    Single-pion production is a key interaction channel in neutrino–nucleus scattering and plays an essential role in the interpretation of accelerator-based neutrino experiments. In high-energy experiments like DUNE <sup><a href="#ref-DUNE">[1]</a></sup> and NO$\nu$A <sup><a href="#ref-NOVA1">[2]</a></sup> $^,$<sup><a href="#ref-NOVA2">[3]</a></sup>, inelastic interactions that produce pions constitute a major contribution to the total neutrino–nucleus cross section. In experiments such as T2K <sup><a href="#ref-T2K">[4]</a></sup>, Hyper-Kamiokande, and the Short-Baseline Neutrino Program, single-pion production (SPP), dominated by the $\Delta$-resonance region, accounts for roughly 20% of all neutrino interactions <sup><a href="#ref-Katori_Martini">[5]</a></sup>$^,$<sup><a href="#ref-Isaacson_Jay">[6]</a></sup>$^,$<sup><a href="#ref-NEUT">[7]</a></sup>. In this process, a neutrino interacts with a nucleon inside a nucleus, produces a resonance and subsequently decays into a nucleon and a pion. In addition, SPP can also contribute to "0-pion" final states when a pion is absorbed or inelastically rescattered. This leads to an important background in the oscillation analyses. A precise description of pion production and nuclear effects is therefore essential to reduce systematic uncertainties in the reconstructed neutrino energy.

    Our work focuses on the development of the Ghent hybrid model <sup><a href="#ref-GHENT">[8]</a></sup> for pion production, which combines a resonance description with a tree-level background from chiral perturbation theory <sup><a href="#ref-HNV">[9]</a></sup>. The original low-energy model including the $\Delta$(1232)-resonance is further extended with higher-energy resonances $P_{11}$(1440), $D_{13}$(1520), $S_{11}$(1535) <sup><a href="#ref-DSD1">[10]</a></sup>$^,$<sup><a href="#ref-DSD2">[11]</a></sup>$^,$<sup><a href="#ref-DSD3">[12]</a></sup>$^,$<sup><a href="#ref-DSD4">[13]</a></sup> and the model is partially unitarized in the $\Delta$-region through Olsson phases <sup><a href="#ref-Olsson">[14]</a></sup>. The tree-level background diagrams are extended to higher energies using Regge theory <sup><a href="#ref-Regge1">[15]</a></sup>$^,$<sup><a href="#ref-Regge2">[16]</a></sup>$^,$<sup><a href="#ref-Regge3">[17]</a></sup>$^,$<sup><a href="#ref-Regge4">[18]</a></sup>. Recent efforts aim to improve the theoretical consistency of the model by unitarizing all contributions using Watson's theorem <sup><a href="#ref-Matthias">[19]</a></sup>. This is achieved by redefining the model in a multipole decomposition, and unitarizing the amplitudes through K-matrix theory.
    
    In addition, we investigate the role of nuclear effects, in particular final-state interactions of the produced pions and nucleons <sup><a href="#ref-Javi">[20]</a></sup>[^Javi]. Inside the nucleus, produced particles like the nucleon and pion can be absorbed, elastically and inelastically rescattered, which modifies the final-state particles. These effects are crucial for reducing systematic uncertainties in neutrino oscillation experiments.

- title: "Two-nucleon knockout"
  type: "side"
  image: "/images/research_page/diagram_2p2h.png"
  caption: 'A $\nu_\mu$ ejects two nucleons from a <strong>correlated pair</strong>, transferring enough momentum to liberate both simultaneously.'
  content: |
    In two-nucleon knockout, a $\nu_\mu$ ejects not one, but two nucleons from the nucleus. This occurs when the nucleons form a correlated pair, transferring enough momentum to liberate both particles from the nucleus simultaneously. This process, often referred to as 2p2h or meson-exchange current (MEC) contributions, constitutes an important part of the total cross section in the region between the quasi-elastic peak and the $\Delta$-resonance.

- title: "Nuclear effects"
  type: "no-image"
  content: |
    Nuclear effects encompass a broad range of phenomena that modify the interaction of neutrinos with nucleons bound inside a nucleus. These include Pauli blocking, Fermi motion, short- and long-range nucleon–nucleon correlations, and final-state interactions (FSI) of outgoing particles. A reliable description of these effects is indispensable for correctly interpreting experimental cross-section measurements.

- title: "Monte Carlo simulations"
  type: "centered"
  image: "/images/research_page/MC_diagram.png"
  caption: 'Schematic of Monte Carlo neutrino event simulation.'
  content: |
    Monte Carlo (MC) simulations are the backbone of neutrino experiment analyses, linking theoretical cross-section models to detector-level observables. Our group works on implementing and validating our theoretical models within widely used neutrino event generators.

    The figure illustrates the typical structure of such a simulation:

    * **Initial state:** A neutrino with a given flavor and energy approaches a nuclear target. At this stage, the nucleus is treated as a many-body system of bound nucleons with non-trivial momentum and energy distributions.
    * **Primary interaction (elementary vertex):** The neutrino interacts with a nucleon inside the nucleus. This step is described by theoretical cross-section models and determines the type of interaction (e.g. quasi-elastic scattering, pion production, 2p2h). The outcome of this stage defines the initial set of outgoing particles produced at the primary interaction and is modelled by our group.
    * **Intranuclear cascade (final-state interactions):** The particles produced in the primary interaction then propagate through the nuclear medium. During this propagation, they can undergo secondary interactions such as rescattering and absorption. These processes can significantly modify both the number and kinematics of particles that eventually leave the nucleus.
    * **Final state and probabilities:** Each simulated event results in a specific final state configuration (for example in the case of muon neutrinos, a muon plus one or more nucleons, with or without pions). he distribution of these outcomes provides predictions for observable quantities at the detector level.

    By improving the physics content of these generators and systematically comparing their predictions to experimental data, the group aims to reduce model uncertainties and enhance the reliability of neutrino measurements. This work is particularly important for current and future oscillation experiments, where precise interaction modeling directly impacts the uncertainties in the oscillations parameters and CP violation phase.
    
