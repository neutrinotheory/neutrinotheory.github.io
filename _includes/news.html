
<div class="well">
<h4>NEWS</h4>

{% for article in site.data.news limit:9 %}
<p>
  <strong>{{ article.date }}</strong><br>
  <span style="color: blue;">
    {{ article.headline | markdownify | remove: '<p>' | remove: '</p>' }}
  </span>
</p>
{% endfor %}

<h4><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></h4>

    </div>
